<script>
const groups=[["python", "Python", ["输入输出与数据类型", "条件判断与循环", "函数与作用域", "列表与二维数组", "字符串处理", "常用容器与标准库", "调试"]], ["basics", "基础算法", ["时间与空间复杂度", "模拟", "枚举与分类讨论", "排序与贪心", "区间与扫描线", "前缀和", "差分", "二分查找", "双指针与滑动窗口", "基础数学与计数", "坐标与矩形几何"]], ["search", "搜索", ["递归与回溯", "深度优先搜索（DFS）", "广度优先搜索（BFS）", "网格搜索与 Flood Fill"]], ["graphs", "图论", ["图的基本概念", "图的存储与遍历", "连通性", "树与树的直径", "最短路（Dijkstra）", "拓扑排序", "最小生成树（Kruskal）"]], ["structures", "数据结构", ["栈与队列", "哈希表与集合", "堆与优先队列", "并查集"]], ["dp", "动态规划", ["状态与转移", "背包问题", "最长公共子序列（LCS）", "网格与图上的动态规划"]]];
const lessons={"python/1": "<article class=\"lesson\"><nav class=\"lesson-nav\" aria-label=\"第1课内容\"><span>第 1 课</span><a href=\"#/python/1\">输入输出</a><a href=\"#/python/2\">条件与循环</a><a href=\"#/python/5\">字符串</a><a href=\"#/python/7\">调试</a><a href=\"#/basics/2\">模拟</a><a href=\"#/basics/3\">枚举</a><a href=\"#/basics/1\">复杂度</a></nav><h2>读入整数与字符串</h2><p><code>input()</code> 每次读入一行，返回字符串。计算之前，需要用 <code>int()</code> 转成整数。</p><pre><code>n = int(input())                 # 一行一个整数\na, b = map(int, input().split()) # 一行两个整数\ns = input().strip()              # 去掉首尾空白</code></pre><p><code>split()</code> 按空白拆分，<code>map(int, ...)</code> 将拆出的文本逐个转成整数。</p><pre><code>print(&quot;3&quot; + &quot;4&quot;)  # 34\nprint(3 + 4)      # 7\nprint(2, -1)      # 2 -1</code></pre><h2>输出格式</h2><p>只输出题目要求的结果，不添加“请输入”“答案是”等提示。<code>print(x, y)</code> 默认用空格分隔两个值。</p><h2>摸底 1：乘积的奇偶性</h2><p>读入两个正整数 a、b。乘积为偶数时输出 <code>Even</code>，否则输出 <code>Odd</code>。先独立完成，再解释判断条件。</p><p class=\"problem-link\"><a href=\"https://atcoder.jp/contests/abs/tasks/abc086_a?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">ABC086_A · Product ↗</a> — 判断两个正整数乘积的奇偶性</p><div class=\"table-scroll\"><table><thead><tr><th>输入</th><th>输出</th></tr></thead><tbody><tr><td>3 4</td><td>Even</td></tr><tr><td>1 21</td><td>Odd</td></tr></tbody></table></div><details class=\"answer\"><summary>提示</summary><p>整数除以 2 的余数为 0，就说明它是偶数。Python 用 <code>%</code> 取余。</p></details><details class=\"answer\"><summary>参考解法（Python）</summary><pre><code>a, b = map(int, input().split())\nif a * b % 2 == 0:\n    print(&quot;Even&quot;)\nelse:\n    print(&quot;Odd&quot;)</code></pre></details><p class=\"note\">在 AtCoder 登录账号后，进入题目页的 Submit，选择 Python 3，提交完整程序。输出格式和大小写应与题面一致。</p></article>", "python/2": "<article class=\"lesson\"><nav class=\"lesson-nav\" aria-label=\"第1课内容\"><span>第 1 课</span><a href=\"#/python/1\">输入输出</a><a href=\"#/python/2\">条件与循环</a><a href=\"#/python/5\">字符串</a><a href=\"#/python/7\">调试</a><a href=\"#/basics/2\">模拟</a><a href=\"#/basics/3\">枚举</a><a href=\"#/basics/1\">复杂度</a></nav><h2>条件判断</h2><pre><code>if a * b % 2 == 0:\n    print(&quot;Even&quot;)\nelse:\n    print(&quot;Odd&quot;)</code></pre><p><code>==</code> 比较是否相等，<code>=</code> 给变量赋值。属于同一分支的语句应保持一致的缩进。</p><h2>循环范围</h2><pre><code>for i in range(3):\n    print(i)       # 0、1、2\n\nfor i in range(1, 4):\n    print(i)       # 1、2、3</code></pre><p><code>range</code> 包含左端点，不包含右端点。枚举 0 到 a 时写 <code>range(a + 1)</code>。</p><h2>摸底 2：统计字符</h2><p>输入一个长度为 3 的 01 字符串，输出其中字符 <code>1</code> 的数量。如果已经会用 <code>count()</code>，再写一个循环版本。</p><p class=\"problem-link\"><a href=\"https://atcoder.jp/contests/abc081/tasks/abc081_a?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">ABC081_A · Placing Marbles ↗</a> — 统计三位 01 字符串中 1 的个数</p><div class=\"table-scroll\"><table><thead><tr><th>输入</th><th>输出</th></tr></thead><tbody><tr><td>101</td><td>2</td></tr><tr><td>000</td><td>0</td></tr><tr><td>111</td><td>3</td></tr></tbody></table></div><details class=\"answer\"><summary>提示</summary><p>循环之前把计数设为 0；遇到字符 <code>\"1\"</code> 时加 1。字符串中的字符不能直接与整数 <code>1</code> 比较。</p></details><details class=\"answer\"><summary>参考解法（Python）</summary><pre><code>s = input().strip()\nanswer = 0\nfor ch in s:\n    if ch == &quot;1&quot;:\n        answer += 1\nprint(answer)</code></pre></details><h2>累加变量的位置</h2><p><code>answer = 0</code> 放在循环外，<code>answer += 1</code> 放在满足条件的分支内。每次重新赋值为 1 无法累计次数。</p><p>练习：到<a href=\"#/python/7\">调试</a>页修复计数程序。</p></article>", "python/5": "<article class=\"lesson\"><nav class=\"lesson-nav\" aria-label=\"第1课内容\"><span>第 1 课</span><a href=\"#/python/1\">输入输出</a><a href=\"#/python/2\">条件与循环</a><a href=\"#/python/5\">字符串</a><a href=\"#/python/7\">调试</a><a href=\"#/basics/2\">模拟</a><a href=\"#/basics/3\">枚举</a><a href=\"#/basics/1\">复杂度</a></nav><h2>索引与遍历</h2><pre><code>s = &quot;101&quot;\nprint(s[0])    # 1，第一个字符\nprint(s[2])    # 1，第三个字符\n\nfor i in range(len(s)):\n    print(i, s[i])\n\nfor ch in s:\n    print(ch)</code></pre><p>字符串长度为 n 时，非负索引范围是 0 到 n − 1。需要保留开头的 0 时，直接把输入作为字符串处理。</p><h2>摸底 3：三位回文数</h2><p>一个三位正整数，从左向右和从右向左相同则输出 <code>Yes</code>，否则输出 <code>No</code>。三位数只需要比较首尾两个字符。</p><p class=\"problem-link\"><a href=\"https://atcoder.jp/contests/abc070/tasks/abc070_a\" target=\"_blank\" rel=\"noopener noreferrer\">ABC070_A · Palindromic Number ↗</a> — 判断三位正整数是否为回文</p><div class=\"table-scroll\"><table><thead><tr><th>输入</th><th>输出</th></tr></thead><tbody><tr><td>575</td><td>Yes</td></tr><tr><td>123</td><td>No</td></tr><tr><td>100</td><td>No</td></tr></tbody></table></div><details class=\"answer\"><summary>参考解法（Python）</summary><pre><code>s = input().strip()\nif s[0] == s[2]:\n    print(&quot;Yes&quot;)\nelse:\n    print(&quot;No&quot;)</code></pre></details><h2>数位和</h2><p>将整数转成字符串后逐位遍历，再把每个字符转回整数。</p><pre><code>value = 123\ndigit_sum = 0\nfor ch in str(value):\n    digit_sum += int(ch)\nprint(digit_sum)  # 6</code></pre><p>应用练习：<a href=\"#/basics/3\">Some Sums：枚举并按数位和筛选</a>。</p></article>", "python/7": "<article class=\"lesson\"><nav class=\"lesson-nav\" aria-label=\"第1课内容\"><span>第 1 课</span><a href=\"#/python/1\">输入输出</a><a href=\"#/python/2\">条件与循环</a><a href=\"#/python/5\">字符串</a><a href=\"#/python/7\">调试</a><a href=\"#/basics/2\">模拟</a><a href=\"#/basics/3\">枚举</a><a href=\"#/basics/1\">复杂度</a></nav><h2>先预测，再运行</h2><p>下面的程序想统计字符 1 的数量。输入 <code>101</code>，它实际会输出什么？尝试找出并逐一修复错误。</p><pre><code>s = input().strip()\nanswer = 0\nfor i in range(1, len(s)):\n    if s[i] == 1:\n        answer = 1\nprint(answer)</code></pre><details class=\"answer\"><summary>查看问题分析</summary><p>原程序输出 0。循环从 1 开始漏掉首字符；字符串字符与整数 1 不相等；计数应该累加，而不是每次赋为 1。</p></details><details class=\"answer\"><summary>参考解法（Python）</summary><pre><code>s = input().strip()\nanswer = 0\nfor ch in s:\n    if ch == &quot;1&quot;:\n        answer += 1\nprint(answer)</code></pre></details><h2>修复后再测试</h2><div class=\"table-scroll\"><table><thead><tr><th>输入</th><th>预期输出</th><th>检查内容</th></tr></thead><tbody><tr><td>101</td><td>2</td><td>不漏首字符</td></tr><tr><td>000</td><td>0</td><td>没有符合条件的字符</td></tr><tr><td>111</td><td>3</td><td>正确累加</td></tr><tr><td>001</td><td>1</td><td>检查最后一个字符</td></tr></tbody></table></div><h2>阅读评测结果</h2><ul><li>AC：通过该题评测。</li><li>WA：输出不正确。先核对规则、边界和输出格式。</li><li>RE：运行异常。检查类型转换、索引以及输入读取。</li><li>TLE：超过时间限制。根据数据范围估计循环次数。</li></ul><p>每次修改后，用能触发该错误的小数据重新运行。模拟题的边界数据见<a href=\"#/basics/2\">模拟</a>。</p></article>", "basics/2": "<article class=\"lesson\"><nav class=\"lesson-nav\" aria-label=\"第1课内容\"><span>第 1 课</span><a href=\"#/python/1\">输入输出</a><a href=\"#/python/2\">条件与循环</a><a href=\"#/python/5\">字符串</a><a href=\"#/python/7\">调试</a><a href=\"#/basics/2\">模拟</a><a href=\"#/basics/3\">枚举</a><a href=\"#/basics/1\">复杂度</a></nav><h2>用变量记录当前状态</h2><p>模拟题按题目规定的顺序执行操作。先确定需要记住的信息，再写清每种操作如何更新这些信息。</p><h2>例题：前进与右转</h2><p class=\"problem-link\"><a href=\"https://atcoder.jp/contests/abc244/tasks/abc244_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">ABC244_B · Go Straight and Turn Right ↗</a> — 从原点朝东出发，执行前进和右转指令</p><p>从 (0, 0) 出发，初始朝东。<code>S</code> 表示前进一步，<code>R</code> 表示原地右转 90°。第一行输入指令数 N，第二行输入指令串 T，输出最终的 x、y。N ≤ 100000。</p><p>需要保存位置 <code>x, y</code> 和方向 <code>d</code>。正 x 指向东，正 y 指向北。</p><div class=\"table-scroll\"><table><thead><tr><th>d</th><th>方向</th><th>前进一步</th></tr></thead><tbody><tr><td>0</td><td>东</td><td>x 加 1</td></tr><tr><td>1</td><td>南</td><td>y 减 1</td></tr><tr><td>2</td><td>西</td><td>x 减 1</td></tr><tr><td>3</td><td>北</td><td>y 加 1</td></tr></tbody></table></div><p>方向按顺时针编号，右转写成 <code>d = (d + 1) % 4</code>。转向时位置保持不变。</p><h2>手动执行 SSRS</h2><div class=\"table-scroll\"><table><thead><tr><th>已执行指令</th><th>x</th><th>y</th><th>方向</th></tr></thead><tbody><tr><td>无</td><td>0</td><td>0</td><td>东</td></tr><tr><td>S</td><td>1</td><td>0</td><td>东</td></tr><tr><td>SS</td><td>2</td><td>0</td><td>东</td></tr><tr><td>SSR</td><td>2</td><td>0</td><td>南</td></tr><tr><td>SSRS</td><td>2</td><td>-1</td><td>南</td></tr></tbody></table></div><h2>独立完成代码</h2><p>先用 <code>if / elif</code> 处理四个方向。下面的 <code>pass</code> 是占位符，需要替换为更新状态的语句。</p><pre><code>n = int(input())\nt = input().strip()\nx, y, d = 0, 0, 0\nfor ch in t:\n    if ch == &quot;R&quot;:\n        pass  # 更新方向\n    else:\n        pass  # 根据方向更新位置\nprint(x, y)</code></pre><h2>测试与提交</h2><div class=\"table-scroll\"><table><thead><tr><th>指令串 T</th><th>N</th><th>最终坐标</th><th>检查内容</th></tr></thead><tbody><tr><td>R</td><td>1</td><td>0 0</td><td>转向不移动</td></tr><tr><td>SSS</td><td>3</td><td>3 0</td><td>初始方向</td></tr><tr><td>RRRRS</td><td>5</td><td>1 0</td><td>转四次回到原方向</td></tr><tr><td>SRSRSRSR</td><td>8</td><td>0 0</td><td>四个方向与负坐标</td></tr></tbody></table></div><p class=\"note\">在 AtCoder 登录账号后，进入题目页的 Submit，选择 Python 3，提交完整程序。输出格式和大小写应与题面一致。</p><details class=\"answer\"><summary>参考解法（Python）</summary><pre><code>n = int(input())\nt = input().strip()\nx, y, d = 0, 0, 0\nmoves = [(1, 0), (0, -1), (-1, 0), (0, 1)]\nfor ch in t:\n    if ch == &quot;R&quot;:\n        d = (d + 1) % 4\n    else:\n        dx, dy = moves[d]\n        x += dx\n        y += dy\nprint(x, y)</code></pre></details><p>参考程序用列表保存四个方向的位移。处理每条指令只做固定数量的操作，因此时间复杂度为 O(N)。状态变量占 O(1) 空间，保存输入指令串需要 O(N) 空间。</p><h2>选做：网格移动</h2><p class=\"problem-link\"><a href=\"https://atcoder.jp/contests/abc364/tasks/abc364_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">ABC364_B · Grid Walk ↗</a> — 在有障碍的网格上模拟移动，非法移动保持原地</p><p>这道题用 U、D、L、R 表示绝对方向。只有目标格在网格内且没有障碍时才移动，否则停在原地。输入输出的行列编号从 1 开始。</p></article>", "basics/3": "<article class=\"lesson\"><nav class=\"lesson-nav\" aria-label=\"第1课内容\"><span>第 1 课</span><a href=\"#/python/1\">输入输出</a><a href=\"#/python/2\">条件与循环</a><a href=\"#/python/5\">字符串</a><a href=\"#/python/7\">调试</a><a href=\"#/basics/2\">模拟</a><a href=\"#/basics/3\">枚举</a><a href=\"#/basics/1\">复杂度</a></nav><h2>枚举候选，再判断条件</h2><p>写枚举前先确定：一个方案用哪些变量表示，每个变量有哪些可能值，什么条件下应计入答案。</p><h2>例题：硬币组合</h2><p class=\"problem-link\"><a href=\"https://atcoder.jp/contests/abc087/tasks/abc087_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">ABC087_B · Coins ↗</a> — 枚举三种面值的硬币数量，统计凑出指定金额的方法</p><p>有 A 枚 500 面值硬币、B 枚 100 面值硬币、C 枚 50 面值硬币。统计凑出金额 X 的选法数量。同面值硬币不区分个体，取出顺序不产生新选法。</p><p>A、B、C 均在 0 到 50 之间，总数至少为 1。X 是 50 的倍数，50 ≤ X ≤ 20000。输入 A、B、C、X，共四行。</p><h2>一个方案对应一个三元组</h2><p>用 i、j、k 表示三种硬币分别取多少枚。A = B = C = 2、X = 100 时，合法方案有两种：</p><div class=\"table-scroll\"><table><thead><tr><th>i：500</th><th>j：100</th><th>k：50</th><th>金额</th></tr></thead><tbody><tr><td>0</td><td>1</td><td>0</td><td>100</td></tr><tr><td>0</td><td>0</td><td>2</td><td>100</td></tr></tbody></table></div><p>范围分别是 0 ≤ i ≤ A、0 ≤ j ≤ B、0 ≤ k ≤ C。每种硬币都可以取 0 枚，也可以全部取完。</p><pre><code>answer = 0\nfor i in range(a + 1):\n    for j in range(b + 1):\n        for k in range(c + 1):\n            if 500 * i + 100 * j + 50 * k == x:\n                answer += 1</code></pre><p>每个选法唯一对应一个三元组，循环恰好访问每个三元组一次，金额判断筛出合法方案，因此不会漏算或重复计数。</p><h2>补齐输入输出并提交</h2><div class=\"table-scroll\"><table><thead><tr><th>A</th><th>B</th><th>C</th><th>X</th><th>答案</th></tr></thead><tbody><tr><td>2</td><td>2</td><td>2</td><td>100</td><td>2</td></tr><tr><td>5</td><td>1</td><td>0</td><td>150</td><td>0</td></tr><tr><td>0</td><td>0</td><td>1</td><td>50</td><td>1</td></tr></tbody></table></div><p class=\"note\">在 AtCoder 登录账号后，进入题目页的 Submit，选择 Python 3，提交完整程序。输出格式和大小写应与题面一致。</p><details class=\"answer\"><summary>参考解法（Python）</summary><pre><code>a = int(input())\nb = int(input())\nc = int(input())\nx = int(input())\nanswer = 0\nfor i in range(a + 1):\n    for j in range(b + 1):\n        for k in range(c + 1):\n            total = 500 * i + 100 * j + 50 * k\n            if total == x:\n                answer += 1\nprint(answer)</code></pre></details><h2>候选数量与优化</h2><p>最多检查 (A + 1)(B + 1)(C + 1) = 51³ = 132651 个候选，三重循环适合本题的数据范围。详见<a href=\"#/basics/1\">时间与空间复杂度</a>。</p><details class=\"answer\"><summary>选讲：减少一层枚举</summary><p>固定 i、j 后，剩余金额唯一确定。检查它是否非负、能被 50 整除，且所需 50 面值硬币不超过 C 枚。</p><pre><code>a = int(input())\nb = int(input())\nc = int(input())\nx = int(input())\nanswer = 0\nfor i in range(a + 1):\n    for j in range(b + 1):\n        rest = x - 500 * i - 100 * j\n        if rest &gt;= 0 and rest % 50 == 0:\n            k = rest // 50\n            if k &lt;= c:\n                answer += 1\nprint(answer)</code></pre></details><h2>独立练习：Some Sums</h2><p class=\"problem-link\"><a href=\"https://atcoder.jp/contests/abc083/tasks/abc083_b?lang=en\" target=\"_blank\" rel=\"noopener noreferrer\">ABC083_B · Some Sums ↗</a> — 枚举整数，按数位和筛选后累加整数本身</p><p>输入 N、A、B，枚举 1 到 N 的整数。若一个数的数位和在 [A, B] 内，就把这个整数加入答案。N ≤ 10000，1 ≤ A ≤ B ≤ 36。</p><p>输入 <code>10 1 2</code> 时，满足条件的数是 1、2、10，答案为 13。</p><details class=\"answer\"><summary>提示</summary><p>对每个整数重新把数位和置零。通过 <code>str(value)</code> 逐位遍历，最后累加的是 <code>value</code>。</p></details><details class=\"answer\"><summary>参考解法（Python）</summary><pre><code>n, a, b = map(int, input().split())\nanswer = 0\nfor value in range(1, n + 1):\n    digit_sum = 0\n    for ch in str(value):\n        digit_sum += int(ch)\n    if a &lt;= digit_sum &lt;= b:\n        answer += value\nprint(answer)</code></pre></details><h2>练习后检查</h2><ul><li>循环是否包含所有端点？</li><li>变量是否在正确的位置初始化？</li><li>答案统计的是方案数量，还是整数总和？</li></ul></article>", "basics/1": "<article class=\"lesson\"><nav class=\"lesson-nav\" aria-label=\"第1课内容\"><span>第 1 课</span><a href=\"#/python/1\">输入输出</a><a href=\"#/python/2\">条件与循环</a><a href=\"#/python/5\">字符串</a><a href=\"#/python/7\">调试</a><a href=\"#/basics/2\">模拟</a><a href=\"#/basics/3\">枚举</a><a href=\"#/basics/1\">复杂度</a></nav><h2>先看数据范围</h2><p>复杂度描述输入规模变大时，运算量或所需空间如何增长。估计循环执行次数，可以帮助判断一种方法是否适合题目的规模。</p><h2>模拟：每条指令处理一次</h2><p><a href=\"#/basics/2\">前进与右转</a>有 N 条指令，每条只更新方向或坐标，时间复杂度为 O(N)。坐标、方向和位移表占 O(1) 空间；完整指令串占 O(N) 空间。</p><h2>枚举：候选数量相乘</h2><p><a href=\"#/basics/3\">Coins</a> 的三重循环检查 (A + 1)(B + 1)(C + 1) 个候选。A、B、C 最大为 50，因此上限是 51³ = 132651。</p><p>时间复杂度为 O((A + 1)(B + 1)(C + 1))，额外空间为 O(1)。三重循环是否合适，取决于循环范围。</p><h2>减少一层循环</h2><p>固定前两种硬币的数量后，第三种硬币的数量可由剩余金额算出。这样时间复杂度变为 O((A + 1)(B + 1))，额外空间仍为 O(1)。先写正确的枚举，再根据规模判断是否需要优化。</p><h2>数位枚举</h2><p>Some Sums 枚举 N 个整数，每个数最多有 D 位，时间复杂度为 O(ND)。本题 N ≤ 10000，D ≤ 5。</p></article>"};
const title='Vincent 的算法竞赛笔记';
const tabs=document.getElementById('tabs'), sidebar=document.getElementById('sidebar'), main=document.getElementById('content');
const link=(g,i)=>`#/${g[0]}/${i+1}`;
const topicList=g=>'<ul>'+g[2].map((label,i)=>`<li><a href="${link(g,i)}">${label}</a></li>`).join('')+'</ul>';
function render(){
 const path=location.hash.slice(1).split('/').filter(Boolean), group=groups.find(g=>g[0]===path[0]), index=Number(path[1])-1, topic=group?.[2][index], home=!group;
 tabs.innerHTML=`<a href="#/" ${home?'aria-current="page"':''}>首页</a>`+groups.map(g=>`<a href="#/${g[0]}" ${g===group?'aria-current="page"':''}>${g[1]}</a>`).join('');
 sidebar.innerHTML=`<a href="#/" ${home?'aria-current="page"':''}>首页</a>`+groups.map(g=>`<details ${g===group?'open':''}><summary>${g[1]}</summary><nav aria-label="${g[1]}知识点">${g[2].map((label,i)=>`<a href="${link(g,i)}" ${g===group&&index===i?'aria-current="page"':''}>${label}</a>`).join('')}</nav></details>`).join('');
 const mobile=group?`<details class="mobile-nav"><summary>${group[1]}目录</summary><nav>${group[2].map((label,i)=>`<a href="${link(group,i)}" ${index===i?'aria-current="page"':''}>${label}</a>`).join('')}</nav></details>`:'';
 if(home){main.innerHTML='<h1>算法竞赛笔记</h1><div class="index">'+groups.map(g=>`<section><h2><a href="#/${g[0]}">${g[1]}</a></h2>${topicList(g)}</section>`).join('')+'</div>';}
 else if(topic){main.innerHTML=mobile+`<p class="breadcrumb"><a href="#/">首页</a> / <a href="#/${group[0]}">${group[1]}</a></p><h1>${topic}</h1>${lessons[group[0]+"/"+(index+1)] || '<p class="pending">待填充</p>'}`;}
 else{main.innerHTML=mobile+`<p class="breadcrumb"><a href="#/">首页</a></p><h1>${group[1]}</h1><div class="category-list">${topicList(group)}</div>`;}
 document.title=(topic?topic+' · ':group?group[1]+' · ':'')+title;window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(location.hash==='#content'){main.focus();return;}render();main.focus({preventScroll:true});});render();
</script><noscript>请启用 JavaScript 以查看知识点目录。</noscript></body></html>
