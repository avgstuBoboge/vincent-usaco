<script>
const groups=[["python", "Python", ["输入输出与数据类型", "条件判断与循环", "函数与作用域", "列表与二维数组", "字符串处理", "常用容器与标准库", "调试与对拍"]], ["basics", "基础算法", ["时间与空间复杂度", "模拟", "枚举与分类讨论", "排序与贪心", "区间与扫描线", "前缀和", "差分", "二分查找", "双指针与滑动窗口", "基础数学与计数", "坐标与矩形几何"]], ["search", "搜索", ["递归与回溯", "深度优先搜索（DFS）", "广度优先搜索（BFS）", "网格搜索与 Flood Fill"]], ["graphs", "图论", ["图的基本概念", "图的存储与遍历", "连通性", "树与树的直径", "最短路（Dijkstra）", "拓扑排序", "最小生成树（Kruskal）"]], ["structures", "数据结构", ["栈与队列", "哈希表与集合", "堆与优先队列", "并查集"]], ["dp", "动态规划", ["状态与转移", "背包问题", "最长公共子序列（LCS）", "网格与图上的动态规划"]]];
const title='Vincent 的算法竞赛笔记';
const tabs=document.getElementById('tabs'), sidebar=document.getElementById('sidebar'), main=document.getElementById('content');
const link=(g,i)=>`#/${g[0]}/${i+1}`;
const topicList=g=>'<ul>'+g[2].map((label,i)=>`<li><a href="${link(g,i)}">${label}</a></li>`).join('')+'</ul>';
function render(){
 const path=location.hash.slice(1).split('/').filter(Boolean), group=groups.find(g=>g[0]===path[0]), index=Number(path[1])-1, topic=group?.[2][index], home=!group;
 tabs.innerHTML=`<a href="#/" ${home?'aria-current="page"':''}>首页</a>`+groups.map(g=>`<a href="#/${g[0]}" ${g===group?'aria-current="page"':''}>${g[1]}</a>`).join('');
 sidebar.innerHTML=`<a href="#/" ${home?'aria-current="page"':''}>首页</a>`+groups.map(g=>`<details ${g===group?'open':''}><summary>${g[1]}</summary><nav aria-label="${g[1]}知识点">${g[2].map((label,i)=>`<a href="${link(g,i)}" ${g===group&&index===i?'aria-current="page"':''}>${label}</a>`).join('')}</nav></details>`).join('');
 const mobile=group?`<details class="mobile-nav"><summary>${group[1]}目录</summary><nav>${group[2].map((label,i)=>`<a href="${link(group,i)}" ${index===i?'aria-current="page"':''}>${label}</a>`).join('')}</nav></details>`:'';
 if(home){main.innerHTML='<h1>算法竞赛笔记</h1><div class="index">'+groups.map(g=>`<section><h2><a href="#/${g[0]}">${g[1]}</a></h2>${topicList(g)}</section>`).join('')+'</div>';}
 else if(topic){main.innerHTML=mobile+`<p class="breadcrumb"><a href="#/">首页</a> / <a href="#/${group[0]}">${group[1]}</a></p><h1>${topic}</h1><p class="pending">待填充</p>`;}
 else{main.innerHTML=mobile+`<p class="breadcrumb"><a href="#/">首页</a></p><h1>${group[1]}</h1><div class="category-list">${topicList(group)}</div>`;}
 document.title=(topic?topic+' · ':group?group[1]+' · ':'')+title;window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(location.hash==='#content'){main.focus();return;}render();main.focus({preventScroll:true});});render();
</script><noscript>请启用 JavaScript 以查看知识点目录。</noscript></body></html>
